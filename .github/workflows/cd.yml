name: CD

on:
  workflow_call:
    inputs:
      trusted-publishing:
        description: >-
          Publish with RubyGems trusted publishing (OIDC) instead of the org-wide RUBYGEMS_API_KEY.
          The calling job must grant id-token: write, and the gem needs a trusted publisher on
          rubygems.org for this workflow. See the README.
        required: false
        type: boolean
        default: false
      ruby-version:
        description: >-
          The Ruby that reads the gemspec and runs `rake release` when trusted-publishing is true.
          The default, the latest Ruby 3.x, matches the ruby:3 image the API-key release runs in.
        required: false
        type: string
        default: '3'
      attestations:
        description: >-
          When trusted-publishing is true, attach Sigstore attestations to the published gem.
          Sigstore's public transparency log records the repository, workflow and commit of each one.
        required: false
        type: boolean
        default: true
jobs:
  deploy: # zizmor: ignore[secrets-outside-env] reusable workflow; environments are managed by callers
    runs-on: ubuntu-latest
    if: ${{ !inputs.trusted-publishing && github.event.workflow_run.conclusion == 'success' }}
    steps:
      # persisted credentials are required here - discourse/publish-rubygems-action's entrypoint.sh runs
      # `rake release`, which does a raw `git push` and never re-authenticates from GITHUB_TOKEN itself; it
      # relies entirely on the credential this checkout step leaves behind. Disabling persistence breaks every
      # deploy with "fatal: could not read Username for 'https://github.com'".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] persisted credentials required for the git push in "Tag and Push Gem" below
          persist-credentials: true
      - name: Tag and Push Gem
        id: tag-and-push-gem
        uses: discourse/publish-rubygems-action@4bd305c65315cb691bad1e8de97a87aaf29a0a85 # v3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GIT_EMAIL: ${{secrets.GUSTO_GIT_EMAIL}}
          GIT_NAME: ${{secrets.GUSTO_GIT_NAME}}
          RUBYGEMS_API_KEY: ${{secrets.RUBYGEMS_API_KEY}}
      - name: Create GitHub Release
        # zizmor: ignore[template-injection] gem_version comes from a trusted prior step
        run: gh release create v${{steps.tag-and-push-gem.outputs.gem_version}} --generate-notes
        if: ${{ steps.tag-and-push-gem.outputs.new_version == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # check, release and github_release are the trusted-publishing path. The API-key path above decides
  # by the git tag, so a tag pushed before a failed `gem push` blocks that version for good. These jobs
  # decide by RubyGems instead, and re-running a failed run skips whatever is already done.
  check:
    name: Check whether a release is needed
    # A fork's pull request can come from a branch named main, so require a push to this repo's default branch.
    if: >-
      inputs.trusted-publishing &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gem: ${{ steps.check.outputs.gem }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      release: ${{ steps.check.outputs.release }}
      github_release: ${{ steps.check.outputs.github_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler: none
      - name: Check whether this version is on RubyGems and has a GitHub release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          shopt -s nullglob
          gemspecs=(*.gemspec)
          if [ "${#gemspecs[@]}" -ne 1 ]; then
            echo "::error::Expected one .gemspec at the repository root, found ${#gemspecs[@]}"
            exit 1
          fi
          ruby -e 'spec = Gem::Specification.load(ARGV[0]) or abort("Could not load #{ARGV[0]}")
            File.write(ARGV[1], "#{spec.name} #{spec.version}\n")' "${gemspecs[0]}" "$RUNNER_TEMP/gem"
          read -r gem version < "$RUNNER_TEMP/gem"
          if ! [[ "$gem" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ && "$version" =~ ^[0-9]+(\.[0-9A-Za-z]+)*$ ]]; then
            echo "::error::Unexpected gem name or version in ${gemspecs[0]}: '$gem' '$version'"
            exit 1
          fi
          {
            echo "gem=$gem"
            echo "version=$version"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::$DEFAULT_BRANCH has moved on from $SHA to $head, so the CD run that follows CI on $head does the release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "github_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/$gem/versions/$version.json")
          case "$status" in
            200) release=false; echo "$gem $version is already on RubyGems." ;;
            404) release=true; echo "$gem $version isn't on RubyGems yet, so this run releases it." ;;
            *) echo "::error::RubyGems returned HTTP $status for $gem $version"; exit 1 ;;
          esac

          if lookup=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
            github_release=false
          elif grep -q 'HTTP 404' <<<"$lookup"; then
            github_release=true
            echo "v$version has no GitHub release yet."
          else
            echo "::error::Couldn't check for a v$version GitHub release: $lookup"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "github_release=$github_release" >> "$GITHUB_OUTPUT"

  release: # zizmor: ignore[excessive-permissions] inherits the caller's permissions on purpose, see below
    name: Release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/${{ needs.check.outputs.gem }}
    # No permissions block, so the job gets the caller's: contents: write to push the tag, and
    # id-token: write for trusted publishing. GitHub checks every called job's permissions against
    # the caller's when the run starts, skipped jobs included, so requesting id-token: write here
    # would fail the run in every repo that hasn't opted in.
    steps:
      - name: Check that the caller granted id-token write
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::Trusted publishing needs id-token: write. Grant it in the permissions of the job that calls shared-config's cd.yml."
            exit 1
          fi
      # `rake release` pushes the current branch along with the tag, so this has to be a branch checkout
      # rather than a detached HEAD at the tested commit. The push needs no persisted credentials:
      # release-gem puts the token in git's credential cache for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Confirm the branch is still the commit CI tested
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$SHA" ]; then
            echo "::error::The default branch moved from $SHA to $head after the check job ran. The CD run that follows CI on $head releases this version."
            exit 1
          fi
      # No bundler cache: a job that publishes the gem shouldn't restore one.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ inputs.ruby-version }}
      - run: bundle install
      # Tags v<version>, pushes the tag and publishes the gem. It tags as the author of the last commit.
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
        with:
          attestations: ${{ inputs.attestations }}

  # Its own job, so re-running a failed run can still create the release after the gem has shipped.
  github_release:
    name: Create GitHub release
    needs: [check, release]
    if: >-
      always() && needs.check.result == 'success' && needs.check.outputs.github_release == 'true' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        # RubyGems treats any version with a letter in it as a prerelease.
        run: |
          prerelease=()
          if [[ "$VERSION" == *[A-Za-z]* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}"

  notify_on_failure: # zizmor: ignore[secrets-outside-env] reusable workflow; environments are managed by callers
    runs-on: ubuntu-latest
    needs: [deploy, check, release, github_release]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ github.repository }}/${{ github.ref }}: FAILED\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
