name: "CodeQL (self-scan)"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: $/.github/workflows/codeql.yml
    with:
      languages: '["actions"]'
