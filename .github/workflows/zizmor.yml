name: GitHub Actions Security Analysis

on:
  workflow_call:
    inputs:
      advanced-security:
        description: >-
          true uploads the results to the repository's Security tab. false reports them as
          annotations and fails the job on any finding, which is what a required check needs,
          since zizmor exits 0 when it writes SARIF.
        required: false
        type: boolean
        default: true

jobs:
  # No permissions block, so the job gets the caller's: contents: read, plus actions: read and
  # security-events: write when advanced-security is true.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: ${{ inputs.advanced-security }}
          annotations: ${{ !inputs.advanced-security }}
